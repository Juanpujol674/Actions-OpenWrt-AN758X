name: PonWrt Multi-profile (AN7581 + AN7583)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build subtarget'
        required: true
        type: choice
        options:
          - both
          - an7581
          - an7583
        default: an7583
      use_onu:
        description: 'Use naoki66 ONU userspace stack (changes firmware; re-test before publishing)'
        required: true
        type: boolean
        default: false
      publish_release:
        description: 'Publish Release after successful build (turn on after validation)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Do NOT cancel a long build when another dispatch is submitted.
concurrency:
  group: ponwrt-multiprofile-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  firmware:
    name: firmware (${{ matrix.soc }}) / build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(inputs.target == 'both' && '["an7581","an7583"]' || format('["{0}"]', inputs.target)) }}

    steps:
      - name: Check out CI configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell
          df -h .

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl xz-utils swig time cmake \
            cpio patch autopoint libelf-dev device-tree-compiler

      - name: Clone PonWrt source (master)
        shell: bash
        run: |
          git clone --depth=1 --branch master https://github.com/pbs05/ponwrt.git openwrt
          git -C openwrt log -1 --format='PonWrt commit: %H'

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-dl-${{ runner.os }}-${{ hashFiles('openwrt/feeds.conf.default') }}

      - name: Run existing DIY plugin preparation
        shell: bash
        working-directory: openwrt
        env:
          # None of the profiles in this workflow is the HM2004-DU FTTR device.
          PROFILE: multi-${{ matrix.soc }}
          ADD_FTTR: 'false'
          USE_ONU: ${{ inputs.use_onu }}
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE/scripts/." ./scripts/
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/files/." ./files/
          # DIY package replacement removes installed feed symlinks.
          # Install feeds first so package/feeds exists and replacements win.
          if [ "$USE_ONU" = true ]; then
            # Same complete userspace feed and firewall4 patch as build-ponwrt.yml.
            sed -i '/^src-git\(-full\)\? pon_userspace /d' feeds.conf.default
            echo 'src-git pon_userspace https://github.com/naoki66/OpenWrt_ONU_CONFIG.git^3cb13560459f1d51136dac662baa1f399028b2b4' >> feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "$USE_ONU" = true ]; then
            test -f feeds/pon_userspace/luci-app-onu/Makefile
            test -f feeds/pon_userspace/patches/firewall4/010-fw4-zone-device-flowtable.patch
            mkdir -p package/network/config/firewall4/patches
            cp feeds/pon_userspace/patches/firewall4/010-fw4-zone-device-flowtable.patch \
              package/network/config/firewall4/patches/999-onu-zone-device-flowtable.patch
          fi
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Combine device configs into single subtarget build
        shell: bash
        working-directory: openwrt
        env:
          SOC: ${{ matrix.soc }}
          USE_ONU: ${{ inputs.use_onu }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/make-multiprofile-config.py" \
            "$SOC" --configs "$GITHUB_WORKSPACE/configs" --output .config
          if [ "$USE_ONU" = true ]; then
            for package in luci-app-onu luci-i18n-onu-zh-cn airoha-pond airoha-ponctl airoha-pon-debug; do
              sed -i "/^CONFIG_PACKAGE_${package}=/d; /^# CONFIG_PACKAGE_${package} is not set/d" .config
              echo "CONFIG_PACKAGE_${package}=y" >> .config
            done
          fi
          # Keep the original P3TERX DIY order: run part2 after .config exists.
          bash "$GITHUB_WORKSPACE/diy-part2.sh"
          make defconfig
          if [ "$USE_ONU" = true ]; then
            for package in luci-app-onu airoha-pond airoha-ponctl airoha-pon-debug; do
              grep -Fxq "CONFIG_PACKAGE_${package}=y" .config || {
                echo "::error::Required ONU package removed by defconfig: $package"
                exit 1
              }
            done
          fi
          bash "$GITHUB_WORKSPACE/scripts/verify-multiprofile.sh" "$SOC"
          echo 'Effective device selection:'
          grep -E '^CONFIG_TARGET_(MULTI_PROFILE|DEVICE_airoha_)' .config

      - name: Download packages
        shell: bash
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j4 download
          find dl -type f -size -1024c -delete || true

      - name: Build all selected devices in ONE make
        shell: bash
        working-directory: openwrt
        run: |
          set -euo pipefail
          # One complete make for the whole subtarget. Device image generation
          # is handled by the OpenWrt multi-profile image rules.
          make -j4

      - name: Stage sysupgrade-only firmware
        shell: bash
        env:
          SOC: ${{ matrix.soc }}
        run: |
          set -euo pipefail
          python3 scripts/stage-only-upgrades.py "$SOC" \
            --images "openwrt/bin/targets/airoha/$SOC" \
            --output "release/$SOC"
          find "release/$SOC" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Prepare timestamped images and release description
        id: release_info
        shell: bash
        env:
          SOC: ${{ matrix.soc }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/make-multiprofile-release.py "$SOC" \
            --images "openwrt/bin/targets/airoha/$SOC" \
            --stage "release/$SOC" --metadata "release-metadata/$SOC" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo
            echo "源码：https://github.com/pbs05/ponwrt"
            echo "分支：master"
            echo "源码提交：$(git -C openwrt rev-parse HEAD)"
            echo "构建记录：$SOURCE_RUN_URL"
          } >> "release-metadata/$SOC/release-notes.md"
          cat "release-metadata/$SOC/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact (only sysupgrade files)
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-${{ matrix.soc }}-${{ steps.release_info.outputs.stamp }}-sysupgrade
          path: release/${{ matrix.soc }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish platform release (optional)
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: multi-${{ matrix.soc }}-${{ steps.release_info.outputs.stamp }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: release-metadata/${{ matrix.soc }}/release-notes.md
          files: release/${{ matrix.soc }}/*
          fail_on_unmatched_files: true
